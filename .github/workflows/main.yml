name: Build Kernel with KernelSU Integration

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven \
            libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 \
            lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3 dos2unix \
            p7zip p7zip-full

      - name: Clone KernelSU
        run: |
          git clone --depth=1 https://github.com/tiann/KernelSU.git drivers/KernelSU

      - name: Apply KernelSU integration patch
        run: |
          patch -p1 < Patches/kernelsu_integration.patch

      - name: (Optional) Integrate SUSFS
        if: github.event.inputs.SUSFS_ENABLE == 'true'
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs4ksu --depth=1
          cp susfs4ksu/kernel_patches/fs/* fs/ || true
          cp susfs4ksu/kernel_patches/include/linux/* include/linux/ || true

      - name: Set up clang toolchain
        run: |
          git clone --depth=1 -b 10.0 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6207600.git clang-custom

      - name: Build kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$PATH
          make O=out ARCH=arm64 vendor/a42xq_eur_open_defconfig
          make -j$(nproc --all) O=out ARCH=arm64

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3 --depth=1
          cp out/arch/arm64/boot/Image* AnyKernel3/
          cp -r out/arch/arm64/boot/dtb* AnyKernel3/ 2>/dev/null || true
          cd AnyKernel3
          zip -r9 ../a42xq-kernel-AnyKernel3.zip ./*

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-a42xq-AnyKernel3
          path: a42xq-kernel-AnyKernel3.zip

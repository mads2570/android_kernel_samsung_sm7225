name: Build on Tag

on:
  workflow_call:
  workflow_dispatch:
env:
  PYTHON_VERSION: "2"
  CLANG_SOURCE: https://github.com/SN-Abdullah-Al-Noman/llvm-arm-toolchain-ship-10.0.git
  CLANG_BRANCH: main
  GCC_64_SOURCE: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git
  GCC_64_BRANCH: lineage-19.1
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v2

    - name: Checkout zipper
      uses: actions/checkout@v2
      with:
        repository: lemniskett/AnyKernel3
        path: zipper

    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Dark-Ages
      with:
        arch: arm64
        compiler: gcc/10
        defconfig: vendor/a42xq_eur_open_defconfig
        image: Image.gz
        dtb: false
        dtbo: true
        kernelsu: true
        kprobes: false

    - name: Release build
      uses: ncipollo/release-action@v1
      with:
        artifacts: ${{ steps.build.outputs.outfile }}
        token: ${{ secrets.GITHUB_TOKEN }}
